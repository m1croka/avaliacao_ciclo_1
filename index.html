<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wit Gestão de Aprendizagem</title>
<style>
:root{--ink:#1e2340;--muted:#69708c;--bg:#f5f6fb;--card:#fff;--purple:#6c4ee3;--purple2:#efeaff;--green:#16845b;--amber:#b66b00;--red:#b63b4b;--line:#e4e6ef;--shadow:0 8px 30px rgba(38,31,85,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#221a46;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin:4px 8px 28px}.brand small{display:block;font-size:11px;font-weight:600;color:#c9c1ee;margin-top:5px}.nav button{display:block;width:100%;border:0;background:transparent;color:#d9d4f2;text-align:left;padding:12px;border-radius:10px;margin:5px 0}.nav button.active,.nav button:hover{background:#382b6d;color:#fff}.main{padding:28px;max-width:1400px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top h1{font-size:26px;margin:0}.top p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.kpi b{font-size:30px;display:block;margin-top:8px}.kpi span{color:var(--muted);font-size:13px}.wide{grid-column:1/-1}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{height:9px;background:#eceef5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);border-radius:999px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eee}.pill.ok{background:#e5f6ef;color:var(--green)}.pill.wait{background:#fff2d9;color:var(--amber)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px}.field.full{grid-column:1/-1}.student-list{display:grid;gap:9px}.student{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px;border-radius:12px;background:#fff}.section-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:14px}.section-tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px}.section-tabs button.active{background:var(--purple);color:#fff;border-color:var(--purple)}.skill{margin-bottom:16px}.skill h3{font-size:15px;line-height:1.45}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;min-height:150px}.level.selected{border-color:var(--purple);background:var(--purple2)}.level strong{display:flex;justify-content:space-between;gap:8px;font-size:13px}.level p{font-size:12px;color:var(--muted);line-height:1.45}.scorebox{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#f8f7ff;border-radius:12px;margin-top:14px}.empty{text-align:center;color:var(--muted);padding:45px 20px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(19,15,40,.55);display:grid;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 14px}.x{border:0;background:transparent;font-size:24px}.note{font-size:12px;color:var(--muted);line-height:1.5}.report-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.report-title{font-size:24px;font-weight:800}.report-meta{color:var(--muted);font-size:13px;line-height:1.7}.rubric-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:10px;padding:10px}.mini b{display:block;font-size:18px}.toast{position:fixed;right:20px;bottom:20px;background:#211a45;color:#fff;padding:11px 15px;border-radius:10px;z-index:50;box-shadow:var(--shadow)}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:static;padding:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}

<script>
const RUBRICS=[{"id": 1, "name": "Tech Start", "max": 100, "skills": [{"text": "Analisar dados apresentados em gráficos, enquetes e nuvem de palavras para reconhecer padrões, hábitos de uso de jogos digitais e diferentes pontos de vista na turma, a fim de desenvolver pensamento crítico.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar os dados apresentados e reconhecer padrões, hábitos de uso de jogos digitais ou diferentes pontos de vista na turma.", "points": 14}, {"name": "Em Desenvolvimento", "desc": "Analisa parcialmente os dados apresentados, reconhecendo alguns padrões, hábitos de uso de jogos digitais ou diferentes pontos de vista na turma, mas apresenta inconsistências nas interpretações.", "points": 24}, {"name": "Proficiente", "desc": "Analisa os dados apresentados em gráficos, enquetes e nuvens de palavras, reconhecendo padrões, hábitos de uso de jogos digitais e diferentes pontos de vista na turma, de modo a fundamentar suas interpretações.", "points": 31}, {"name": "Avançado", "desc": "Analisa os dados apresentados em gráficos, enquetes e nuvens de palavras com consistência, identificando padrões, hábitos de uso de jogos digitais e diferentes pontos de vista na turma, e estabelece relações entre essas informações para aprofundar suas interpretações críticas.", "points": 34}]}, {"text": "Reconhecer os jogos digitais como parte da cultura digital, da economia e das formas de comunicação na sociedade atual para analisar sua influência na vida cotidiana e na sociedade contemporânea.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para reconhecer os jogos digitais como parte da cultura digital, da economia e das formas de comunicação, sem identificar sua influência na vida cotidiana e na sociedade contemporânea.", "points": 13}, {"name": "Em Desenvolvimento", "desc": "Reconhece parcialmente a presença dos jogos digitais na cultura digital, na economia ou nas formas de comunicação, identificando de maneira limitada sua influência na vida cotidiana e na sociedade contemporânea.", "points": 23}, {"name": "Proficiente", "desc": "Reconhece os jogos digitais como parte da cultura digital, da economia e das formas de comunicação, identificando sua influência na vida cotidiana e na sociedade contemporânea.", "points": 30}, {"name": "Avançado", "desc": "Reconhece os jogos digitais como parte da cultura digital, da economia e das formas de comunicação, analisando de maneira consistente sua influência na vida cotidiana e na sociedade contemporânea.", "points": 33}]}, {"text": "Analisar a evolução histórica dos jogos digitais ao longo do tempo para interpretar as transformações tecnológicas e sociais de cada época.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar a evolução histórica dos jogos digitais e interpretar as transformações tecnológicas e sociais de cada época.", "points": 13}, {"name": "Em Desenvolvimento", "desc": "Identifica algumas mudanças na evolução histórica dos jogos digitais, mas apresenta inconsistências ao interpretar as transformações tecnológicas e sociais de cada época.", "points": 23}, {"name": "Proficiente", "desc": "Analisa a evolução histórica dos jogos digitais, interpretando as principais transformações tecnológicas e sociais de cada época.", "points": 30}, {"name": "Avançado", "desc": "Analisa a evolução histórica dos jogos digitais de forma consistente, estabelecendo relações claras entre as mudanças nos jogos e as transformações tecnológicas e sociais de cada época.", "points": 33}]}]}, {"id": 2, "name": "Experimentação", "max": 150, "skills": [{"text": "Identificar objetivo do jogo, regras, desafios, ações do jogador, condições de vitória e penalidades em jogos digitais e jogos de tabuleiro, por meio da experimentação prática, para compreender os elementos que estruturam seu funcionamento.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para identificar o objetivo, as regras, os desafios, as ações do jogador, as condições de vitória e as penalidades nos jogos digitais e de tabuleiro experimentados.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Identifica alguns dos elementos que estruturam os jogos digitais e de tabuleiro experimentados, mas apresenta inconsistências no reconhecimento de seus objetivos, regras, desafios, ações do jogador, condições de vitória e penalidades.", "points": 35}, {"name": "Proficiente", "desc": "Identifica o objetivo, as regras, os desafios, as ações do jogador, as condições de vitória e as penalidades nos jogos digitais e de tabuleiro experimentados, reconhecendo os elementos que estruturam seu funcionamento.", "points": 45}, {"name": "Avançado", "desc": "Identifica de forma consistente o objetivo, as regras, os desafios, as ações do jogador, as condições de vitória e as penalidades nos jogos digitais e de tabuleiro experimentados, compreendendo como esses elementos se articulam no funcionamento dos jogos.", "points": 50}]}, {"text": "Analisar como as ações do jogador influenciam o funcionamento dos jogos durante a experimentação, para identificar relações entre regras, desafios, condições de vitória e penalidades presentes na experiência de jogo.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar como as ações do jogador influenciam o funcionamento dos jogos e identificar relações entre regras, desafios, condições de vitória e penalidades durante a experimentação.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Identifica algumas relações entre as ações do jogador e os elementos do jogo, mas apresenta inconsistências ao analisar como as regras, os desafios, as condições de vitória e as penalidades influenciam a experiência de jogo.", "points": 35}, {"name": "Proficiente", "desc": "Analisa como as ações do jogador influenciam o funcionamento dos jogos, identificando relações entre regras, desafios, condições de vitória e penalidades durante a experimentação.", "points": 45}, {"name": "Avançado", "desc": "Analisa de forma consistente como as ações do jogador influenciam o funcionamento dos jogos, estabelecendo relações claras entre regras, desafios, condições de vitória e penalidades observadas durante a experimentação.", "points": 50}]}, {"text": "Comparar diferentes jogos a partir da observação de seus objetivos, regras, desafios, ações do jogador, condições de vitória e penalidades, para reconhecer características comuns e diferenças entre eles.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para comparar diferentes jogos a partir de seus objetivos, regras, desafios, ações do jogador, condições de vitória e penalidades, não reconhecendo suas características comuns e diferenças.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Compara diferentes jogos a partir de alguns de seus elementos, reconhecendo características comuns ou diferenças, mas apresenta inconsistências nessa identificação.", "points": 35}, {"name": "Proficiente", "desc": "Compara diferentes jogos a partir de seus objetivos, regras, desafios, ações do jogador, condições de vitória e penalidades, reconhecendo características comuns e diferenças entre eles.", "points": 45}, {"name": "Avançado", "desc": "Compara diferentes jogos de forma consistente, identificando características comuns e diferenças e relacionando-as aos objetivos, às regras, aos desafios, às ações do jogador, às condições de vitória e às penalidades de cada jogo.", "points": 50}]}]}, {"id": 3, "name": "Atividade de Aprendizagem", "max": 250, "skills": [{"text": "Planejar e criar jogos de tabuleiro com materiais concretos de forma colaborativa para integrar objetivos, regras, desafios, condições de vitória, penalidades e bônus em uma proposta autoral.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para planejar e criar um jogo de tabuleiro com materiais concretos, integrando objetivos, regras, desafios, condições de vitória, penalidades e bônus à proposta autoral.", "points": 34}, {"name": "Em Desenvolvimento", "desc": "Participa do planejamento e da criação de um jogo de tabuleiro com materiais concretos, integrando parcialmente os elementos previstos, mas apresenta inconsistências na articulação entre eles.", "points": 59}, {"name": "Proficiente", "desc": "Planeja e cria colaborativamente um jogo de tabuleiro com materiais concretos, integrando objetivos, regras, desafios, condições de vitória, penalidades e bônus em uma proposta autoral.", "points": 76}, {"name": "Avançado", "desc": "Planeja e cria colaborativamente um jogo de tabuleiro com materiais concretos, integrando de forma consistente objetivos, regras, desafios, condições de vitória, penalidades e bônus, com articulação clara entre esses elementos na proposta autoral.", "points": 84}]}, {"text": "Produzir componentes de jogos de tabuleiro, elaborando cards de ação, desafio, bônus e penalidade para compor a experiência de jogo.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para produzir cards de ação, desafio, bônus e penalidade para compor a experiência de jogo.", "points": 33}, {"name": "Em Desenvolvimento", "desc": "Produz parcialmente os cards de ação, desafio, bônus e penalidade, mas apresenta inconsistências na elaboração dos componentes para a experiência de jogo.", "points": 58}, {"name": "Proficiente", "desc": "Produz cards de ação, desafio, bônus e penalidade, integrando-os à experiência de jogo.", "points": 75}, {"name": "Avançado", "desc": "Produz cards de ação, desafio, bônus e penalidade de forma consistente, contribuindo para uma experiência de jogo coerente com a função de cada componente.", "points": 83}]}, {"text": "Avaliar e registrar o funcionamento dos jogos criados por meio de partidas experimentais, como jogadores, para identificar problemas e propor melhorias nas regras e mecânicas criadas.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para avaliar e registrar o funcionamento dos jogos durante as partidas experimentais, como jogador, identificando problemas ou propondo melhorias nas regras e mecânicas criadas.", "points": 33}, {"name": "Em Desenvolvimento", "desc": "Avalia e registra parcialmente o funcionamento dos jogos durante as partidas experimentais, identificando alguns problemas ou propondo melhorias nas regras e mecânicas, mas apresenta inconsistências nessas ações.", "points": 58}, {"name": "Proficiente", "desc": "Avalia e registra o funcionamento dos jogos durante as partidas experimentais, como jogador, identificando problemas e propondo melhorias nas regras e mecânicas criadas.", "points": 75}, {"name": "Avançado", "desc": "Avalia e registra o funcionamento dos jogos de forma consistente durante as partidas experimentais, como jogador, identificando problemas e propondo melhorias coerentes com as situações observadas nas regras e mecânicas criadas.", "points": 83}]}]}, {"id": 4, "name": "WIT Talk", "max": 150, "skills": [{"text": "Investigar o impacto da opinião do público e da comunidade no aprimoramento de produtos de mídia e jogos, por meio de pesquisas rápidas na internet, a fim de compreender como os produtos culturais refletem as demandas da sociedade.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para investigar o impacto da opinião do público e da comunidade no aprimoramento de produtos de mídia e jogos por meio de pesquisas na internet, sem estabelecer relações com as demandas da sociedade.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Investiga parcialmente a influência da opinião do público e da comunidade no aprimoramento de produtos de mídia e jogos, identificando algumas relações com as demandas da sociedade, mas apresenta inconsistências na interpretação das informações pesquisadas.", "points": 35}, {"name": "Proficiente", "desc": "Investiga, por meio de pesquisas rápidas na internet, como a opinião do público e da comunidade influencia o aprimoramento de produtos de mídia e jogos, relacionando esse processo às demandas da sociedade.", "points": 45}, {"name": "Avançado", "desc": "Investiga de forma consistente, por meio de pesquisas rápidas na internet, como a opinião do público e da comunidade influencia o aprimoramento de produtos de mídia e jogos, estabelecendo relações claras entre as mudanças realizadas nesses produtos e as demandas da sociedade.", "points": 50}]}, {"text": "Analisar o funcionamento, as regras e o design de protótipos de jogos de tabuleiro, através da experimentação prática em estações de jogo e do preenchimento de tabelas avaliativas numéricas e descritivas, para diagnosticar falhas, propor melhorias estruturais e validar processos de criação coletiva.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar o funcionamento, as regras e o design dos protótipos de jogos de tabuleiro, com registros avaliativos insuficientes para diagnosticar falhas e propor melhorias estruturais.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Analisa parcialmente o funcionamento, as regras e o design dos protótipos durante a experimentação prática e preenche as tabelas avaliativas, mas apresenta inconsistências no diagnóstico de falhas e na proposição de melhorias estruturais.", "points": 35}, {"name": "Proficiente", "desc": "Analisa o funcionamento, as regras e o design dos protótipos durante a experimentação prática nas estações de jogo, preenche as tabelas avaliativas numéricas e descritivas, diagnostica falhas e propõe melhorias estruturais para validar os processos de criação coletiva.", "points": 45}, {"name": "Avançado", "desc": "Analisa de forma consistente o funcionamento, as regras e o design dos protótipos durante a experimentação prática nas estações de jogo, utiliza os registros numéricos e descritivos para diagnosticar falhas com precisão e propõe melhorias estruturais coerentes com os resultados da avaliação, contribuindo para a validação dos processos de criação coletiva.", "points": 50}]}, {"text": "Comunicar críticas construtivas, análises técnicas e reflexões sobre o processo de produção e cooperação, de forma oral e escrita, durante as sessões de feedback coletivo, visando desenvolver a empatia, a responsabilidade social e a capacidade de aprimoramento no trabalho em equipe.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para comunicar críticas construtivas, análises técnicas e reflexões sobre o processo de produção e cooperação, de forma oral ou escrita, durante as sessões de feedback coletivo.", "points": 20}, {"name": "Em Desenvolvimento", "desc": "Comunica parcialmente críticas construtivas, análises técnicas e reflexões sobre o processo de produção e cooperação durante as sessões de feedback coletivo, mas apresenta inconsistências na clareza ou na pertinência das contribuições.", "points": 35}, {"name": "Proficiente", "desc": "Comunica críticas construtivas, análises técnicas e reflexões pertinentes sobre o processo de produção e cooperação, de forma oral e escrita, durante as sessões de feedback coletivo, contribuindo para o aprimoramento do trabalho em equipe.", "points": 45}, {"name": "Avançado", "desc": "Comunica críticas construtivas, análises técnicas e reflexões de forma clara, fundamentada e consistente, tanto oralmente quanto por escrito, contribuindo para a compreensão dos aspectos a aprimorar no processo de produção e cooperação.", "points": 50}]}]}, {"id": 5, "name": "MetaWIT", "max": 100, "skills": [{"text": "Analisar as próprias experiências de aprendizagem durante as atividades do Ciclo 1, considerando as produções realizadas, as descobertas, as dificuldades e as estratégias utilizadas, para reconhecer os conhecimentos construídos ao longo do ciclo.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar as próprias experiências de aprendizagem, identificando poucas relações entre as produções realizadas, as descobertas, as dificuldades e as estratégias utilizadas ao longo do ciclo.", "points": 14}, {"name": "Em Desenvolvimento", "desc": "Analisa parcialmente as próprias experiências de aprendizagem, reconhecendo algumas produções, descobertas, dificuldades ou estratégias utilizadas, mas apresenta limitações para identificar os conhecimentos construídos ao longo do ciclo.", "points": 24}, {"name": "Proficiente", "desc": "Analisa as próprias experiências de aprendizagem, considerando as produções realizadas, as descobertas, as dificuldades e as estratégias utilizadas, e reconhece os conhecimentos construídos ao longo do ciclo.", "points": 31}, {"name": "Avançado", "desc": "Analisa as próprias experiências de aprendizagem de forma consistente, relacionando as produções realizadas, as descobertas, as dificuldades e as estratégias utilizadas para reconhecer os conhecimentos construídos ao longo do ciclo.", "points": 34}]}, {"text": "Criar um Diário de Bordo Digital na plataforma Milanote, utilizando recursos de organização e formatação, para registrar as experiências de aprendizagem, as contribuições pessoais, os desafios e as reflexões realizadas ao longo do Ciclo 1.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para criar e organizar o Diário de Bordo Digital no Milanote, com registros insuficientes das experiências de aprendizagem, das contribuições pessoais, dos desafios e das reflexões realizadas ao longo do ciclo.", "points": 13}, {"name": "Em Desenvolvimento", "desc": "Cria o Diário de Bordo Digital no Milanote e registra parcialmente as experiências de aprendizagem, as contribuições pessoais, os desafios e as reflexões realizadas, mas apresenta inconsistências na organização ou na formatação dos registros.", "points": 23}, {"name": "Proficiente", "desc": "Cria e organiza o Diário de Bordo Digital no Milanote, utilizando recursos de organização e formatação para registrar as experiências de aprendizagem, as contribuições pessoais, os desafios e as reflexões realizadas ao longo do ciclo.", "points": 30}, {"name": "Avançado", "desc": "Cria e organiza o Diário de Bordo Digital no Milanote de forma consistente, utilizando adequadamente os recursos de organização e formatação para apresentar registros completos e bem estruturados das experiências de aprendizagem, das contribuições pessoais, dos desafios e das reflexões realizadas ao longo do ciclo.", "points": 33}]}, {"text": "Definir uma meta pessoal de aprendizagem para o próximo ciclo, identificando ações necessárias e possibilidades de colaboração da equipe, para orientar o próprio desenvolvimento.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para definir uma meta pessoal de aprendizagem para o próximo ciclo e identificar ações necessárias ou possibilidades de colaboração da equipe para orientar o próprio desenvolvimento.", "points": 13}, {"name": "Em Desenvolvimento", "desc": "Define uma meta pessoal de aprendizagem para o próximo ciclo, mas identifica parcialmente as ações necessárias ou as possibilidades de colaboração da equipe para alcançar essa meta.", "points": 23}, {"name": "Proficiente", "desc": "Define uma meta pessoal de aprendizagem para o próximo ciclo e identifica ações necessárias e possibilidades de colaboração da equipe para orientar o próprio desenvolvimento.", "points": 30}, {"name": "Avançado", "desc": "Define uma meta pessoal de aprendizagem clara para o próximo ciclo e identifica ações específicas e possibilidades de colaboração da equipe coerentes com a meta estabelecida, orientando o próprio desenvolvimento.", "points": 33}]}]}, {"id": 6, "name": "Desafio", "max": 250, "skills": [{"text": "Revisar o planejamento de um jogo de tabuleiro, tendo como referência os feedbacks obtidos em testes, identificando os ajustes a serem realizados no protótipo.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para revisar o planejamento do jogo de tabuleiro com base nos feedbacks obtidos nos testes, identificando poucos ajustes necessários no protótipo.", "points": 34}, {"name": "Em Desenvolvimento", "desc": "Revisa parcialmente o planejamento do jogo de tabuleiro com base nos feedbacks obtidos nos testes, identificando alguns ajustes, mas apresenta inconsistências na relação entre os feedbacks e as alterações propostas.", "points": 59}, {"name": "Proficiente", "desc": "Revisa o planejamento do jogo de tabuleiro com base nos feedbacks obtidos nos testes, identificando os ajustes necessários no protótipo.", "points": 76}, {"name": "Avançado", "desc": "Revisa o planejamento do jogo de tabuleiro de forma consistente, relacionando os feedbacks obtidos nos testes aos ajustes necessários no protótipo.", "points": 84}]}, {"text": "Analisar feedbacks recebidos em grupo, discutindo os resultados para priorizar os ajustes de uma próxima iteração.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para analisar os feedbacks recebidos e discutir os resultados em grupo, sem identificar ajustes a serem priorizados na próxima iteração.", "points": 33}, {"name": "Em Desenvolvimento", "desc": "Analisa parcialmente os feedbacks recebidos e participa da discussão dos resultados em grupo, mas apresenta inconsistências na identificação ou na priorização dos ajustes para a próxima iteração.", "points": 58}, {"name": "Proficiente", "desc": "Analisa os feedbacks recebidos e discute os resultados em grupo, priorizando os ajustes a serem realizados na próxima iteração.", "points": 75}, {"name": "Avançado", "desc": "Analisa os feedbacks recebidos de forma consistente e discute os resultados em grupo, estabelecendo prioridades claras para os ajustes da próxima iteração com base nos resultados analisados.", "points": 83}]}, {"text": "Aplicar ajustes planejados ao protótipo do jogo de forma colaborativa, modificando regras, aspectos visuais e ações do jogador para tornar a experiência mais intuitiva e jogável.", "levels": [{"name": "Insuficiente", "desc": "Apresenta dificuldade para aplicar os ajustes planejados ao protótipo, realizando poucas modificações nas regras, nos aspectos visuais ou nas ações do jogador para melhorar a experiência de jogo.", "points": 33}, {"name": "Em Desenvolvimento", "desc": "Aplica parcialmente os ajustes planejados ao protótipo de forma colaborativa, modificando alguns elementos, mas apresenta inconsistências na adequação das alterações para tornar a experiência mais intuitiva e jogável.", "points": 58}, {"name": "Proficiente", "desc": "Aplica colaborativamente os ajustes planejados ao protótipo, modificando regras, aspectos visuais e ações do jogador para tornar a experiência mais intuitiva e jogável.", "points": 75}, {"name": "Avançado", "desc": "Aplica colaborativamente os ajustes planejados ao protótipo de forma consistente, articulando as modificações nas regras, nos aspectos visuais e nas ações do jogador para tornar a experiência mais intuitiva e jogável.", "points": 83}]}]}];
const KEY='wit_avaliacao_ciclo1_v1';
const blank=()=>({classes:[],students:[],assessments:{},settings:{teacher:''}});
let db=load(); let currentSection=0;
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));toast('Dados salvos neste navegador.')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
const totalMax=RUBRICS.reduce((a,s)=>a+s.max,0), criteria=RUBRICS.reduce((a,s)=>a+s.skills.length,0);
function assessment(id){return db.assessments[id]||{answers:{},date:new Date().toISOString().slice(0,10),notes:''}}
function stats(id){let a=assessment(id),answered=0,points=0;RUBRICS.forEach((s,si)=>s.skills.forEach((k,ki)=>{let v=a.answers[si+'_'+ki];if(v!==undefined){answered++;points+=k.levels[v].points}}));return {answered,points,pct:Math.round(points/totalMax*100),complete:answered===criteria}}
function go(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));let titles={dashboard:['Dashboard','Acompanhe o progresso das avaliações.'],turmas:['Turmas e estudantes','Cadastre as turmas e gerencie os estudantes.'],avaliar:['Avaliar estudante','Selecione o estudante e registre os níveis observados.'],resultados:['Resultados','Consulte resultados individuais e gere relatórios.'],backup:['Backup','Proteja os dados salvos neste navegador.']};document.getElementById('pageTitle').textContent=titles[v][0];document.getElementById('pageSub').textContent=titles[v][1];render(v)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
function render(v){({dashboard:renderDashboard,turmas:renderTurmas,avaliar:renderAvaliar,resultados:renderResultados,backup:renderBackup}[v])()}
function renderDashboard(){let done=db.students.filter(s=>stats(s.id).complete).length;let avg=db.students.length?Math.round(db.students.reduce((a,s)=>a+stats(s.id).pct,0)/db.students.length):0;let rows=db.students.map(s=>{let st=stats(s.id);return `<tr><td><b>${esc(s.name)}</b><br><small>${esc(className(s.classId))}</small></td><td>${st.answered}/${criteria}</td><td>${st.points}/${totalMax}</td><td><div class="bar"><i style="width:${st.pct}%"></i></div><small>${st.pct}%</small></td><td><span class="pill ${st.complete?'ok':'wait'}">${st.complete?'Completa':'Em andamento'}</span></td><td><button class="btn" onclick="startAssess('${s.id}')">Avaliar</button></td></tr>`}).join('');document.getElementById('view').innerHTML=`<div class="grid"><div class="card kpi"><span>Estudantes</span><b>${db.students.length}</b></div><div class="card kpi"><span>Turmas</span><b>${db.classes.length}</b></div><div class="card kpi"><span>Avaliações completas</span><b>${done}</b></div><div class="card kpi"><span>Aproveitamento médio</span><b>${avg}%</b></div><div class="card wide"><h2>Progresso da turma</h2>${rows?`<div style="overflow:auto"><table class="table"><thead><tr><th>Estudante</th><th>Critérios</th><th>Pontos</th><th>Aproveitamento</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Cadastre uma turma e seus estudantes para começar.</div>'}</div></div>`}
function className(id){return db.classes.find(c=>c.id===id)?.name||'Sem turma'}
function renderTurmas(){let cards=db.classes.map(c=>{let ss=db.students.filter(s=>s.classId===c.id);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3 style="margin:0">${esc(c.name)}</h3><small>${ss.length} estudante(s)</small></div><button class="btn danger" onclick="delClass('${c.id}')">Excluir</button></div><div class="student-list" style="margin-top:14px">${ss.map(s=>`<div class="student"><span>${esc(s.name)}</span><span><button class="btn" onclick="startAssess('${s.id}')">Avaliar</button> <button class="btn danger" onclick="delStudent('${s.id}')">×</button></span></div>`).join('')||'<small>Nenhum estudante.</small>'}</div></div>`}).join('');document.getElementById('view').innerHTML=`<div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="openClassModal()">+ Nova turma</button><button class="btn" onclick="openStudentModal()">+ Novo estudante</button></div><div class="two">${cards||'<div class="card empty wide">Crie sua primeira turma.</div>'}</div>`}
function openClassModal(){modal(`<div class="modalhead"><h2>Nova turma</h2><button class="x" onclick="closeModal()">×</button></div><div class="field"><label>Nome da turma</label><input id="className" placeholder="Ex.: Oficina de Games A"></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="addClass()">Salvar turma</button></div>`)}
function addClass(){let n=document.getElementById('className').value.trim();if(!n)return;db.classes.push({id:uid(),name:n});save();closeModal();go('turmas')}
function openStudentModal(){if(!db.classes.length){openClassModal();toast('Crie uma turma primeiro.');return}modal(`<div class="modalhead"><h2>Novo estudante</h2><button class="x" onclick="closeModal()">×</button></div><div class="form"><div class="field full"><label>Nome do estudante</label><input id="studentName"></div><div class="field full"><label>Turma</label><select id="studentClass">${db.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="addStudent()">Salvar estudante</button></div>`)}
function addStudent(){let n=document.getElementById('studentName').value.trim(),c=document.getElementById('studentClass').value;if(!n)return;db.students.push({id:uid(),name:n,classId:c});save();closeModal();go('turmas')}
function delStudent(id){if(!confirm('Excluir este estudante e sua avaliação?'))return;db.students=db.students.filter(s=>s.id!==id);delete db.assessments[id];save();go('turmas')}
function delClass(id){if(db.students.some(s=>s.classId===id)){alert('Exclua ou mova os estudantes desta turma primeiro.');return}if(confirm('Excluir esta turma?')){db.classes=db.classes.filter(c=>c.id!==id);save();go('turmas')}}
function modal(content){let m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="modalbox">${content}</div></div>`;m.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function startAssess(id){sessionStorage.setItem('witStudent',id);currentSection=0;go('avaliar')}
function renderAvaliar(){let selected=sessionStorage.getItem('witStudent')||db.students[0]?.id||'';if(!db.students.length){document.getElementById('view').innerHTML='<div class="card empty">Cadastre um estudante antes de iniciar a avaliação.</div>';return}let st=db.students.find(s=>s.id===selected)||db.students[0];sessionStorage.setItem('witStudent',st.id);let a=assessment(st.id),sec=RUBRICS[currentSection];let tabs=RUBRICS.map((s,i)=>`<button class="${i===currentSection?'active':''}" onclick="currentSection=${i};renderAvaliar()">${i+1}. ${esc(s.name)}</button>`).join('');let skills=sec.skills.map((k,ki)=>{let key=currentSection+'_'+ki,v=a.answers[key];return `<div class="card skill"><h3>${ki+1}. ${esc(k.text)}</h3><div class="levels">${k.levels.map((l,li)=>`<button class="level ${v===li?'selected':''}" onclick="choose('${st.id}','${key}',${li})"><strong><span>${esc(l.name)}</span><span>${l.points} pts</span></strong><p>${esc(l.desc)}</p></button>`).join('')}</div></div>`}).join('');let secPts=sec.skills.reduce((sum,k,ki)=>{let v=a.answers[currentSection+'_'+ki];return sum+(v===undefined?0:k.levels[v].points)},0);document.getElementById('view').innerHTML=`<div class="card no-print" style="margin-bottom:14px"><div class="form"><div class="field"><label>Estudante</label><select onchange="sessionStorage.setItem('witStudent',this.value);currentSection=0;renderAvaliar()">${db.students.map(s=>`<option value="${s.id}" ${s.id===st.id?'selected':''}>${esc(s.name)} | ${esc(className(s.classId))}</option>`).join('')}</select></div><div class="field"><label>Professor(a)</label><input value="${esc(db.settings.teacher||'')}" onchange="db.settings.teacher=this.value;save()"></div><div class="field"><label>Data da avaliação</label><input type="date" value="${a.date||''}" onchange="setMeta('${st.id}','date',this.value)"></div><div class="field"><label>Status geral</label><input value="${stats(st.id).answered}/${criteria} critérios avaliados" disabled></div></div></div><div class="section-tabs no-print">${tabs}</div><div class="scorebox no-print"><div><b>${currentSection+1}. ${esc(sec.name)}</b><br><small>${sec.skills.length} habilidades</small></div><div><b>${secPts} / ${sec.max} pontos</b></div></div><div style="height:12px"></div>${skills}<div class="card no-print"><div class="field"><label>Observações gerais do estudante</label><textarea rows="4" onchange="setMeta('${st.id}','notes',this.value)">${esc(a.notes||'')}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="prevSec()">Seção anterior</button><button class="btn primary" onclick="nextSec()">Próxima seção</button><button class="btn" onclick="showReport('${st.id}')">Ver relatório</button></div></div>`}
function choose(id,key,level){let a=assessment(id);a.answers[key]=level;db.assessments[id]=a;save();renderAvaliar()}
function setMeta(id,k,v){let a=assessment(id);a[k]=v;db.assessments[id]=a;save()}
function prevSec(){currentSection=Math.max(0,currentSection-1);renderAvaliar();scrollTo(0,0)}function nextSec(){currentSection=Math.min(RUBRICS.length-1,currentSection+1);renderAvaliar();scrollTo(0,0)}
function renderResultados(){let rows=db.students.map(s=>{let st=stats(s.id);return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(className(s.classId))}</td><td>${st.points}/${totalMax}</td><td>${st.pct}%</td><td><span class="pill ${st.complete?'ok':'wait'}">${st.complete?'Completa':'Incompleta'}</span></td><td><button class="btn" onclick="showReport('${s.id}')">Relatório</button></td></tr>`}).join('');document.getElementById('view').innerHTML=`<div class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>Estudante</th><th>Turma</th><th>Pontos</th><th>Aproveitamento</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${rows?'':'<div class="empty">Nenhum estudante cadastrado.</div>'}</div>`}
function showReport(id){let s=db.students.find(x=>x.id===id),a=assessment(id),st=stats(id);let sections=RUBRICS.map((sec,si)=>{let pts=0,rows=sec.skills.map((k,ki)=>{let v=a.answers[si+'_'+ki],lev=v===undefined?null:k.levels[v];if(lev)pts+=lev.points;return `<tr><td>${ki+1}. ${esc(k.text)}</td><td>${lev?esc(lev.name):'Não avaliado'}</td><td>${lev?lev.points:0}</td></tr>`}).join('');return `<div class="report-break"><h3>${si+1}. ${esc(sec.name)} <small>${pts}/${sec.max}</small></h3><table class="table"><thead><tr><th>Habilidade</th><th>Nível observado</th><th>Pontos</th></tr></thead><tbody>${rows}</tbody></table></div>`}).join('');modal(`<div class="modalhead no-print"><h2>Relatório individual</h2><button class="x" onclick="closeModal()">×</button></div><div id="report"><div class="report-head"><div><div class="report-title">Avaliação de Aprendizagem</div><div>Ciclo 1 | Oficina de Games</div></div><div class="report-meta"><b>${esc(s.name)}</b><br>${esc(className(s.classId))}<br>Professor(a): ${esc(db.settings.teacher||'Não informado')}<br>Data: ${esc(a.date||'Não informada')}</div></div><div class="rubric-summary" style="margin:18px 0"><div class="mini"><small>Pontos</small><b>${st.points}/${totalMax}</b></div><div class="mini"><small>Aproveitamento</small><b>${st.pct}%</b></div><div class="mini"><small>Situação</small><b>${st.complete?'Completa':'Incompleta'}</b></div></div>${sections}${a.notes?`<div class="report-break"><h3>Observações</h3><p>${esc(a.notes)}</p></div>`:''}</div><div class="actions no-print" style="margin-top:18px"><button class="btn primary" onclick="window.print()">Imprimir ou salvar em PDF</button><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function renderBackup(){document.getElementById('view').innerHTML=`<div class="two"><div class="card"><h2>Exportar backup</h2><p class="note">Os dados ficam salvos no armazenamento local deste navegador. Exporte um backup periodicamente para não perder avaliações ao limpar dados do navegador ou trocar de computador.</p><button class="btn primary" onclick="exportBackup()">Baixar backup JSON</button></div><div class="card"><h2>Importar backup</h2><p class="note">A importação substitui os dados atuais pelo conteúdo do arquivo selecionado.</p><input type="file" id="backupFile" accept="application/json"><button class="btn" style="margin-top:10px" onclick="importBackup()">Importar arquivo</button></div></div><div class="card" style="margin-top:14px"><h2>Sobre esta versão</h2><p class="note">Esta primeira versão funciona sem servidor e sem login. Ela utiliza as 18 habilidades e pontuações da planilha original do Ciclo 1. Para uso simultâneo por vários professores e acesso em diferentes dispositivos, a próxima etapa é conectar a aplicação a um banco de dados online com autenticação.</p></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wit_avaliacao_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){let f=document.getElementById('backupFile').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('Substituir os dados atuais pelo backup?'))return;db={...blank(),...d};save();go('dashboard')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
go('dashboard');
</script></body></html>
